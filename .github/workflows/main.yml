                      '                ui.text(Face::Regular, (11.0 * ui_s).clamp(9.5, 13.0), c2_x + 14.0, r2_y + 70.0, color::MUTED, &l3);',
                      '                ui.text(Face::Medium, (11.0 * ui_s).clamp(9.5, 13.0), c2_x + 14.0, r2_y + row_h - 19.0, color::ACCENT, "Lihat Log Lengkap →");',
