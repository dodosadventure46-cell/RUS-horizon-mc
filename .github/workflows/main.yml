name: Build Horizon Android Zalith 2 Plus v2.3 APK (Fixed Keystore Update, Shader Anti-Fog, Download Progress & Custom BG Settings)

on:
  push:
    branches: [ "android", "main", "master" ]
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: "(Opsional) ID File / Link Google Drive ZIP jika tidak upload ZIP ke repo"
        required: false
        default: ""
      accent_hex:
        description: "Warna Aksen ZalithLauncher 2 Plus (Hex)"
        required: false
        default: "0xA8C7FA"
      ui_scale_pct:
        description: "Ukuran Default UI Launcher (75 - 125%)"
        required: false
        default: "100"
      ely_default_user:
        description: "Username Default Akun Ely.by / Offline"
        required: false
        default: "dodo"

jobs:
  build-zalith2-apk:
    name: Build APK ZalithLauncher 2 Plus v2.3 (ZalithLauncher-2-Plus-Horizon)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: 1. Checkout Repository Pengguna
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: 2. Siapkan Source Code Vasysik/horizon-android (Pin v0.7.6 Stabil)
        run: |
          mkdir -p /tmp/zalith-zips /tmp/zalith-hnmods
          find user-repo -maxdepth 3 -name "*.zip" -exec cp {} /tmp/zalith-zips/ \; || true
          find user-repo -maxdepth 3 -name "*.hnmod" -exec cp {} /tmp/zalith-hnmods/ \; || true
          if [ -f "user-repo/tools/android_build.py" ] && [ -f "user-repo/research-lock.json" ]; then
            cp -a user-repo/. workdir/
          else
            git clone --depth 1 -b v0.7.6 https://github.com/Vasysik/horizon-android.git workdir || git clone --depth 1 -b android https://github.com/Vasysik/horizon-android.git workdir
          fi

      - name: 3. Injeksi Fitur ZalithLauncher 2 Plus v2.3 & Pasang Keystore Tetap (Anti-Uninstall)
        working-directory: workdir
        env:
          GDRIVE_INPUT: ${{ github.event.inputs.gdrive_file_id }}
          ACCENT_HEX: ${{ github.event.inputs.accent_hex || '0xA8C7FA' }}
          DEFAULT_UI_SCALE: ${{ github.event.inputs.ui_scale_pct || '100' }}
          DEFAULT_ELY_USER: ${{ github.event.inputs.ely_default_user || 'dodo' }}
        run: |
          mkdir -p /tmp/zalith-extract mixins ~/.android .local/android
          if [ -n "$GDRIVE_INPUT" ]; then
            FILE_ID=$(echo "$GDRIVE_INPUT" | sed -n 's/.*[-/]\([0-9A-Za-z_-]\{25,\}\).*/\1/p')
            if [ -z "$FILE_ID" ]; then FILE_ID="$GDRIVE_INPUT"; fi
            curl -sL "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o /tmp/zalith-zips/gdrive-zalith2.zip || true
          fi
          shopt -s nullglob
          for zf in /tmp/zalith-zips/*.zip; do
            echo "Mengekstrak konfigurasi dari: $zf ..."
            unzip -q -o "$zf" -d /tmp/zalith-extract || true
          done
          if [ -f "/tmp/zalith-extract/zalith2-fixed.keystore" ]; then
            cp -f /tmp/zalith-extract/zalith2-fixed.keystore ~/.android/debug.keystore
            cp -f /tmp/zalith-extract/zalith2-fixed.keystore .local/android/debug.keystore
            echo "Keystore tetap berhasil dipasang (Update APK ke depannya tidak perlu uninstall!)."
          fi
          find /tmp/zalith-extract -name "*.hnmod" -exec cp {} /tmp/zalith-hnmods/ \; 2>/dev/null || true
          for hnm in /tmp/zalith-hnmods/*.hnmod; do
            unzip -q -o "$hnm" "mixins/*" -d . 2>/dev/null || true
          done
          python3 /tmp/zalith-extract/zalith_patcher.py

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Android SDK, NDK 28.2.13676358, Build-Tools 35.0.0 & Gradle 8.14
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_DIR/cmdline-tools"
            unzip -q -o /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_DIR" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          find "$SDK_DIR/ndk" -mindepth 1 -maxdepth 1 ! -name "28.2.13676358" -exec rm -rf {} + 2>/dev/null || true
          find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 ! -name "35.0.0" -exec rm -rf {} + 2>/dev/null || true
          if [ ! -x "/tmp/gradle-8.14/bin/gradle" ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle-8.14.zip
            unzip -q -o /tmp/gradle-8.14.zip -d /tmp
          fi
          echo "GRADLE_BIN=/tmp/gradle-8.14/bin/gradle" >> "$GITHUB_ENV"

      - name: 6. Install Rust Toolchain Sesuai rust-toolchain.toml (aarch64-linux-android)
        working-directory: workdir
        run: |
          TOOLCHAIN=$(python3 -c 'import tomllib, pathlib; p=pathlib.Path("rust-toolchain.toml"); print(tomllib.loads(p.read_text())["toolchain"]["channel"] if p.exists() else "stable")')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
          rustup target add aarch64-linux-android --toolchain "$TOOLCHAIN"

      - name: 7. Siapkan Engine Tables, Compile APK & Tanda Tangani dengan Keystore Tetap
        working-directory: workdir
        run: |
          set -e
          git checkout -- .github 2>/dev/null || true
          git clean -fd -e mixins -e .local || true
          mkdir -p ~/.android .local/android
          if [ -f "/tmp/zalith-extract/zalith2-fixed.keystore" ]; then
            cp -f /tmp/zalith-extract/zalith2-fixed.keystore ~/.android/debug.keystore
            cp -f /tmp/zalith-extract/zalith2-fixed.keystore .local/android/debug.keystore
          fi
          python3 -c 'import json,pathlib,urllib.request,zipfile; r=pathlib.Path("."); v=json.loads((r/"research-lock.json").read_text())["minecraft"]["version"]; d=r/".local/horizon-client"/v; d.mkdir(parents=True,exist_ok=True); urllib.request.urlretrieve("https://github.com/Vasysik/horizon-android/releases/download/v0.7.6/Horizon-Android-0.7.6-arm64-v8a.apk","/tmp/ref.apk"); zipfile.ZipFile(zipfile.ZipFile("/tmp/ref.apk").open("assets/engine-data.zip")).extractall(d); print("Engine tables ready:",d)' || python3 tools/android_prepare.py
          python3 tools/android_build.py --abi arm64-v8a --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$GRADLE_BIN"
          if [ -f "/tmp/zalith-extract/zalith2-fixed.keystore" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/zalith-extract/zalith2-fixed.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android .local/android/apk/arm64-v8a/horizon-android-public.apk
            echo "APK berhasil ditandatangani dengan Keystore Tetap (zalith2-fixed.keystore)!"
          fi
          mkdir -p dist-apk
          cp -v .local/android/apk/arm64-v8a/horizon-android-public.apk "dist-apk/ZalithLauncher-2-Plus-Horizon-arm64-v8a.apk"

      - name: 8. Upload File APK Siap Install (Direct Download di Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-2-Plus-Horizon-arm64-v8a-APK
          path: |
            workdir/dist-apk/*.apk
            workdir/.local/android/apk/arm64-v8a/*.apk
          if-no-files-found: error
          retention-days: 30
