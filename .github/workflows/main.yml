                      '            ui.text(Face::Medium, rk_f, right_x + ((right_w - rk_w) * 0.5).max(10.0), av_y + av_size + 46.0, color::ACCENT, player_rank);',
                      '',
                      '            let pt_lbl = format!("Play Time: {:.1} Hours", total_h).replace(\'.\', ",");',
                      '            let pt_f = (11.5 * ui_s).clamp(9.5, 13.5);',
                      '            let pt_w = ui.measure(Face::Regular, pt_f, &pt_lbl);',
                      '            ui.text(Face::Regular, pt_f, right_x + ((right_w - pt_w) * 0.5).max(10.0), av_y + av_size + 64.0, color::MUTED, &pt_lbl);',
                      '',
                      '            let prof_y = 142.0 + grid_h + 12.0 - 104.0;',
                      '            let prof_lbl = ui.fit_text(Face::Medium, (11.5 * ui_s).clamp(9.5, 13.5), &format!("UI {:.0}% · Ely.by #{}", ui_scale_pct, self.catalog.config.profile), right_w - 36.0);',
                      '            button(&mut ui, &mut self.targets, [right_x + 14.0, prof_y, right_w - 28.0, 38.0], &prof_lbl, Action::Profile, false);',
